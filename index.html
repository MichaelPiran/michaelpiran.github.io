<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Piran — Software & Systems Architect</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --border: #30363d;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .card h1 {
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #7ee787;
      background: rgba(126, 231, 135, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      border: 1px solid rgba(126, 231, 135, 0.2);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #7ee787;
      border-radius: 50%;
      box-shadow: 0 0 8px #7ee787;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="status">
      <span class="dot"></span> Online via GitHub Pages
    </div>
    <h1 style="margin-top: 1rem;">System Status: Operational</h1>
    <p>
      Sito e dominio custom configurati correttamente.
    </p>
  </main>
</body>
</html>
